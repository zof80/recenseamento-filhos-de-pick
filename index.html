<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recenseamento Geral dos Filhos de Pick - 2026</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Recenseamento Geral dos Filhos de Pick - 2026</h1>

    <p>Recenseamento geral da comunidade de Kabuka Pick</p>

    <form>

        <h2>1. Identificação</h2>

        <label for="numero">Nº de Recenseamento:</label>
        <input type="text" id="numero" name="numero">

        <br><br>

        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome">

        <br><br>

        <label>Sexo:</label>

        <input type="radio" id="masculino" name="sexo" value="Masculino">
        <label for="masculino">Masculino</label>

        <input type="radio" id="feminino" name="sexo" value="Feminino">
        <label for="feminino">Feminino</label>

        <br><br>

        
        <h2>2. Ligação a Kabuka Pick</h2>

        <!-- Primeira linha: Avós -->
        <input type="radio" id="avo_paterno" name="ligacao_familiar" value="Avô paterno">
        <label for="avo_paterno">Avô paterno</label>

        <input type="radio" id="avo_paterna" name="ligacao_familiar" value="Avó paterna">
        <label for="avo_paterna">Avó paterna</label>

        <input type="radio" id="avo_materno" name="ligacao_familiar" value="Avô materno">
        <label for="avo_materno">Avô materno</label>

        <input type="radio" id="avo_materna" name="ligacao_familiar" value="Avó materna">
        <label for="avo_materna">Avó materna</label>

        <br><br>

        <!-- Segunda linha: Pais -->
        <input type="radio" id="pai" name="ligacao_familiar" value="Pai">
        <label for="pai">Pai</label>

        <input type="radio" id="mae" name="ligacao_familiar" value="Mãe">
        <label for="mae">Mãe</label>

        <input type="radio" id="pai_mae" name="ligacao_familiar" value="Pai e Mãe">
        <label for="pai_mae">Pai e Mãe</label>

        <br><br>

        <!-- Nomes dos avós -->
        <label for="nome_avo_paterno">Nome do avô paterno:</label>
        <input type="text" id="nome_avo_paterno" name="nome_avo_paterno">

        <br><br>

        <label for="nome_avo_paterna">Nome da avó paterna:</label>
        <input type="text" id="nome_avo_paterna" name="nome_avo_paterna">

        <br><br>

        <label for="nome_avo_materno">Nome do avô materno:</label>
        <input type="text" id="nome_avo_materno" name="nome_avo_materno">

        <br><br>

        <label for="nome_avo_materna">Nome da avó materna:</label>
        <input type="text" id="nome_avo_materna" name="nome_avo_materna">

        <br><br>

        <!-- Nomes dos pais -->
        <label for="nome_pai">Nome do pai:</label>
        <input type="text" id="nome_pai" name="nome_pai">

        <br><br>

        <label for="nome_mae">Nome da mãe:</label>
        <input type="text" id="nome_mae" name="nome_mae">

        <br><br>


        <h2>3. Residência Atual</h2>

        <label for="pais">País onde reside atualmente:</label>
        <input type="text" id="pais" name="pais">

        <br><br>

        <label for="cidade">Cidade / Localidade:</label>
        <input type="text" id="cidade" name="cidade">

        <br><br>

        <h2>4. Contacto</h2>

        <label for="telefone">Telefone / WhatsApp:</label>
        <input type="tel" id="telefone" name="telefone">

        <br><br>

        <h2>5. Registo do Recenseamento</h2>

        <label for="data_recenseamento">Data do recenseamento:</label>
        <input type="date" id="data_recenseamento" name="data_recenseamento">

        <br><br>

        <label>Forma de recenseamento:</label>

        <input type="radio" id="telefone_forma" name="forma_recenseamento" value="Telefone">
        <label for="telefone_forma">Telefone</label>

        <input type="radio" id="online" name="forma_recenseamento" value="Online">
        <label for="online">Online</label>

        <input type="radio" id="presencial" name="forma_recenseamento" value="Presencial">
        <label for="presencial">Presencial</label>

        <br><br>

        <label for="recenseador">Recenseamento efetuado por:</label>
        <input type="text" id="recenseador" name="recenseador">

        <br><br>

        <button type="submit">Enviar Recenseamento</button>

    </form>

    <script>

        const URL_APPS_SCRIPT ="https://script.google.com/macros/s/AKfycbwkzis5fRRKXcUvqiedH8JTDRWb-LWylc5NUB7a1OyoCUfN8L8r4qpHjvZTQCGcyD2H/exec";

        const formulario = document.querySelector("form");

        formulario.addEventListener("submit", function(event) {
        event.preventDefault();

        const dados = {
        numero: document.getElementById("numero").value,
        nome: document.getElementById("nome").value,
        sexo: document.querySelector('input[name="sexo"]:checked')?.value || "",
        ligacao_familiar: document.querySelector('input[name="ligacao_familiar"]:checked')?.value || "",
        nome_pai: document.getElementById("nome_pai").value,
        nome_mae: document.getElementById("nome_mae").value,
        nome_avo_paterno: document.getElementById("nome_avo_paterno").value,
        nome_avo_paterna: document.getElementById("nome_avo_paterna").value,
        nome_avo_materno: document.getElementById("nome_avo_materno").value,
        nome_avo_materna: document.getElementById("nome_avo_materna").value,
        pais: document.getElementById("pais").value,
        cidade: document.getElementById("cidade").value,
        telefone: document.getElementById("telefone").value,
        data_recenseamento: document.getElementById("data_recenseamento").value,
        forma_recenseamento: document.querySelector('input[name="forma_recenseamento"]:checked')?.value || "",
        recenseador: document.getElementById("recenseador").value
    };

    fetch(URL_APPS_SCRIPT, {
    method: "POST",
    body: JSON.stringify(dados)
})
.then(response => response.json())
.then(resultado => {
    if (resultado.status === "sucesso") {
        alert("Recenseamento enviado com sucesso!");
        formulario.reset();
    } else {
        alert("Ocorreu um erro ao enviar o recenseamento.");
    }
})
.catch(erro => {
    console.error("Erro:", erro);
    alert("Não foi possível enviar o recenseamento.");
});
});

    </script>

    
</body>
</html>
